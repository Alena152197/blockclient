name: 🚀 Деплой Nuxt.js проекта (Node 22 + PM2)

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Не запускать два деплоя сразу — иначе pm2/сборка на VPS пересекаются и сайт падает
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🔐 Проверить секрет деплоя
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          missing=
          [ -n "$DEPLOY_HOOK_URL" ] || missing="$missing DEPLOY_HOOK_URL"
          [ -n "$DEPLOY_SECRET" ] || missing="$missing DEPLOY_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты:$missing"
            exit 1
          fi
          echo "hook=$DEPLOY_HOOK_URL"

      - name: 🚀 Старт deploy на VPS
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          set -e
          code=$(curl -sS -o /tmp/deploy-res.json -w "%{http_code}" \
            -X POST "$DEPLOY_HOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Secret: $DEPLOY_SECRET" \
            --connect-timeout 20 \
            --max-time 60)
          echo "HTTP $code"
          cat /tmp/deploy-res.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Deploy hook failed with HTTP $code"
            exit 1
          fi

      - name: ⏳ Дождаться окончания сборки на VPS
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          set -e
          # …/api/deploy → …/api/deploy/status
          STATUS_URL="${DEPLOY_HOOK_URL%/}/status"
          echo "poll $STATUS_URL"
          ok=0
          for i in $(seq 1 40); do
            body=$(curl -sS --connect-timeout 10 --max-time 20 "$STATUS_URL" || echo '{}')
            echo "[$i] $body" | head -c 400
            echo
            st=$(printf '%s' "$body" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status') or '')" 2>/dev/null || true)
            if [ "$st" = "ok" ]; then
              ok=1
              break
            fi
            if [ "$st" = "fail" ]; then
              echo "::error::Deploy failed on VPS — см. logTail / .deploy.log"
              echo "$body"
              exit 1
            fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Timeout waiting for deploy (no ok in .deploy.status)"
            curl -sS "$STATUS_URL" || true
            exit 1
          fi
          echo "Deploy finished OK"
