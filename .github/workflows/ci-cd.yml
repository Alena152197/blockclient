name: 🚀 Деплой Nuxt.js проекта (Node 22 + PM2)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🔐 Проверить SSH-секреты
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=
          [ -n "$HOST" ] || missing="$missing HOST"
          [ -n "$USERNAME" ] || missing="$missing USERNAME"
          [ -n "$PORT" ] || missing="$missing PORT"
          # Jino proxy часто принимает пароль, а ключ — нет
          if [ -z "$SSH_PASSWORD" ] && [ -z "$SSH_PRIVATE_KEY" ]; then
            missing="$missing SSH_PASSWORD_or_SSH_PRIVATE_KEY"
          fi
          if [ -n "$missing" ]; then
            echo "::error::В GitHub → Settings → Secrets and variables → Actions не заданы:$missing"
            echo "Для Jino Nuxt-VPS: HOST=4cce9171d57c.vps.myjino.ru, PORT из панели, USERNAME=root, SSH_PASSWORD=пароль root."
            exit 1
          fi
          echo "HOST length: ${#HOST}"
          echo "USERNAME length: ${#USERNAME}"
          echo "PORT: $PORT"
          echo "SSH_PASSWORD set: $([ -n "$SSH_PASSWORD" ] && echo yes || echo no)"
          echo "SSH_PRIVATE_KEY set: $([ -n "$SSH_PRIVATE_KEY" ] && echo yes || echo no)"

      - name: 📦 Получить код
        uses: actions/checkout@v5

      - name: 📦 Установить Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Установить зависимости
        run: npm ci

      - name: 🗑 Очистить кэш
        run: rm -rf .nuxt dist .output || true

      - name: 🔨 Собрать проект
        run: npm run build
        env:
          NUXT_PUBLIC_STRAPI_URL: ${{ secrets.NUXT_PUBLIC_STRAPI_URL }}
          NUXT_PUBLIC_CONTENT_ADMIN_EMAILS: ${{ secrets.NUXT_PUBLIC_CONTENT_ADMIN_EMAILS }}
          NUXT_PUBLIC_CONTENT_ADMIN_USERNAMES: ${{ secrets.NUXT_PUBLIC_CONTENT_ADMIN_USERNAMES }}
          STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}

      - name: 🔍 Проверить сборку
        run: test -f .output/server/index.mjs && ls -la .output/server/index.mjs

      - name: 📁 Передать проект на сервер
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/var/www/blockclient"
          overwrite: true
          tar_dereference: true
          rm: false
          exclude: "node_modules,.git,.data,.nuxt,.output/public/_nuxt/*.map,.env,.posts-backup.json,.posts-tmp.json"

      - name: 🔁 Установить зависимости и перезапустить PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/blockclient
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 22 || nvm use default || true
            npm install --omit=dev
            pm2 restart client-prod || pm2 restart all || pm2 start ecosystem.config.cjs --only client-prod
            pm2 status
