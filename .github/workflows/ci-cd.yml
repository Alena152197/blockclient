name: 🚀 Деплой Nuxt.js проекта (Node 22 + PM2)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🔐 Проверить SSH-секреты
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          missing=
          [ -n "$HOST" ] || missing="$missing HOST"
          [ -n "$USERNAME" ] || missing="$missing USERNAME"
          [ -n "$PORT" ] || missing="$missing PORT"
          [ -n "$SSH_PASSWORD" ] || missing="$missing SSH_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты:$missing"
            exit 1
          fi
          echo "HOST ok, PORT=$PORT, password set"

      # Сборка на GitHub не нужна: код тянем на VPS и собираем там
      # (SCP через прокси Jino у вас стабильно падает)

      - name: 🚀 git pull + build + pm2 на Nuxt-VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 20m
          script: |
            set -e
            cd /var/www/blockclient
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 22 || nvm use default || true
            node -v
            git fetch origin main
            git reset --hard origin/main
            # .env на сервере не трогаем
            npm ci
            npm run build
            test -f .output/server/index.mjs
            pm2 restart client-prod || pm2 start ecosystem.config.cjs --only client-prod
            pm2 save || true
            pm2 status
