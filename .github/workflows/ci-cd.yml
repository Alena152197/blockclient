name: 🚀 Деплой Nuxt.js проекта (Node 22 + PM2)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🔐 Проверить секрет деплоя
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          missing=
          [ -n "$DEPLOY_HOOK_URL" ] || missing="$missing DEPLOY_HOOK_URL"
          [ -n "$DEPLOY_SECRET" ] || missing="$missing DEPLOY_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты:$missing"
            echo "DEPLOY_HOOK_URL пример: https://fenix1521.ru/api/deploy"
            exit 1
          fi
          echo "hook=$DEPLOY_HOOK_URL"

      # Jino: внешний SSH (:22) часто НЕ контейнер VPS. Деплой через HTTPS → POST /api/deploy.
      - name: 🚀 Вызвать deploy hook на VPS
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          set -e
          code=$(curl -sS -o /tmp/deploy-res.json -w "%{http_code}" \
            -X POST "$DEPLOY_HOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Secret: $DEPLOY_SECRET" \
            --connect-timeout 20 \
            --max-time 60)
          echo "HTTP $code"
          cat /tmp/deploy-res.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Deploy hook failed with HTTP $code"
            exit 1
          fi
          echo "Deploy started on VPS (см. /var/www/blockclient/.deploy.log)"
